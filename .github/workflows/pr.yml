name: GAS WARP Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

##################################################
# CHECKOUT
##################################################

    - name: Checkout
      uses: actions/checkout@v4

##################################################
# BASE PACKAGES
##################################################

    - name: Install base packages
      run: |
        sudo apt update
        sudo apt install -y curl wget tar net-tools

##################################################
# NODE
##################################################

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Node packages
      run: |
        npm init -y
        npm install express cors socks-proxy-agent

##################################################
# RELAY SERVER
##################################################

    - name: Create relay server
      run: |

        cat << 'EOF' > server.js
        const express=require("express")
        const cors=require("cors")
        const {SocksProxyAgent}=require("socks-proxy-agent")

        const app=express()

        const AUTH=process.env.TUNNEL_KEY||"change_me"

        const PORT=3000

        const agent=new SocksProxyAgent("socks5h://127.0.0.1:1080")

        app.use(cors())
        app.use(express.json({limit:"10mb"}))

        //////////////////////////////////////////////////
        // RATE LIMIT
        //////////////////////////////////////////////////

        const rateMap=new Map()

        const WINDOW=60000
        const MAX=60

        function rateLimit(ip){

          const now=Date.now()

          if(!rateMap.has(ip))rateMap.set(ip,[])

          const arr=rateMap.get(ip)

          while(arr.length&&now-arr[0]>WINDOW){
            arr.shift()
          }

          if(arr.length>=MAX)return true

          arr.push(now)

          return false
        }

        //////////////////////////////////////////////////
        // BLOCKED HOSTS
        //////////////////////////////////////////////////

        const blocked=[
        "localhost",
        "127.0.0.1",
        "0.0.0.0",
        "::1",
        "metadata.google.internal"
        ]

        function isBlocked(url){

          try{
            const u=new URL(url)
            return blocked.includes(u.hostname)
          }catch{
            return true
          }

        }

        //////////////////////////////////////////////////
        // ROOT
        //////////////////////////////////////////////////

        app.get("/",(req,res)=>{
          res.json({
          service:"warp-relay",
          status:"online"
          })
        })

        //////////////////////////////////////////////////
        // RELAY
        //////////////////////////////////////////////////

        app.post("/relay",async(req,res)=>{

          const ip=req.headers["cf-connecting-ip"]||req.socket.remoteAddress

          if(req.headers["x-auth"]!==AUTH){
            return res.status(403).json({error:"forbidden"})
          }

          if(rateLimit(ip)){
            return res.status(429).json({error:"rate_limited"})
          }

          const r=req.body||{}

          if(!r.url){
            return res.status(400).json({error:"missing_url"})
          }

          if(isBlocked(r.url)){
            return res.status(403).json({error:"blocked_host"})
          }

          const method=(r.method||"GET").toUpperCase()

          try{

            const controller=new AbortController()

            const timeout=setTimeout(()=>{
              controller.abort()
            },30000)

            const response=await fetch(r.url,{
            method:method,
            headers:r.headers||{},
            body:r.body,
            agent:agent,
            signal:controller.signal
            })

            clearTimeout(timeout)

            const type=response.headers.get("content-type")||""

            const stream=
            type.includes("video")||
            type.includes("audio")||
            type.includes("octet-stream")

            if(stream){

              res.status(response.status)

              response.headers.forEach((v,k)=>{

                if(!["transfer-encoding","connection"].includes(k.toLowerCase())){
                  res.setHeader(k,v)
                }

              })

              const reader=response.body.getReader()

              async function pump(){

                while(true){

                  const {done,value}=await reader.read()

                  if(done)break

                  res.write(Buffer.from(value))

                }

                res.end()

              }

              return pump()

            }

            const buf=Buffer.from(await response.arrayBuffer())

            res.json({
            ok:true,
            status:response.status,
            headers:Object.fromEntries(response.headers.entries()),
            body:buf.toString("base64")
            })

          }catch(e){

            res.status(500).json({
            error:String(e)
            })

          }

        })

        app.listen(PORT,()=>{
          console.log("🚀 Relay running on "+PORT)
        })
        EOF

##################################################
# START NODE
##################################################

    - name: Start relay
      env:
        TUNNEL_KEY: ${{ secrets.TUNNEL_KEY }}
      run: |
        nohup node server.js > server.log 2>&1 &
        sleep 5
        cat server.log

##################################################
# INSTALL WGCF
##################################################

    - name: Install WGCF
      run: |
        wget -q https://github.com/ViRb3/wgcf/releases/latest/download/wgcf_2.2.30_linux_amd64 -O wgcf
        chmod +x wgcf
        sudo mv wgcf /usr/local/bin/

        yes | wgcf register
        wgcf generate

##################################################
# INSTALL WIREPROXY
##################################################

    - name: Install WireProxy
      run: |
        wget -q https://github.com/pufferffish/wireproxy/releases/latest/download/wireproxy_linux_amd64.tar.gz
        tar -xzf wireproxy_linux_amd64.tar.gz
        chmod +x wireproxy
        sudo mv wireproxy /usr/local/bin/

##################################################
# BUILD WARP CONFIG
##################################################

    - name: Build config
      run: |

        PRIVATE=$(grep PrivateKey wgcf-profile.conf | awk '{print $3}')
        ADDRESS=$(grep Address wgcf-profile.conf | awk '{print $3}')
        DNS=$(grep DNS wgcf-profile.conf | awk '{print $3}')
        PUBLIC=$(grep PublicKey wgcf-profile.conf | awk '{print $3}')
        ENDPOINT=$(grep Endpoint wgcf-profile.conf | awk '{print $3}')

        cat > config.ini <<EOF
        [Interface]
        PrivateKey = $PRIVATE
        Address = $ADDRESS
        DNS = $DNS

        [Peer]
        PublicKey = $PUBLIC
        Endpoint = $ENDPOINT

        [Socks5]
        BindAddress = 127.0.0.1:1080
        EOF

##################################################
# START WARP
##################################################

    - name: Start WARP
      run: |
        nohup wireproxy -c config.ini > warp.log 2>&1 &
        sleep 10
        netstat -tulpn | grep 1080 || true

##################################################
# TEST WARP
##################################################

    - name: Test WARP
      run: |
        curl --socks5 127.0.0.1:1080 https://ipinfo.io

##################################################
# CLOUDFLARED
##################################################

    - name: Install Cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
        chmod +x cloudflared

##################################################
# START TUNNEL
##################################################

    - name: Start Tunnel
      run: |
        nohup ./cloudflared tunnel \
        --url http://127.0.0.1:3000 \
        --no-autoupdate \
        > tunnel.log 2>&1 &

        sleep 15

        echo "==============================="
        echo "✅ TUNNEL URL"
        grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel.log | head -n 1
        echo "==============================="

##################################################
# KEEP RUNNER
##################################################

    - name: Keep runner alive
      run: |
        echo "Tunnel active 6 hours"

        for i in $(seq 1 360)
        do
          curl --socks5 127.0.0.1:1080 https://ipinfo.io/ip || true
          sleep 60
        done
