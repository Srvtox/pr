name: GAS Tunnel + WARP Proxy

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:

    ##################################################
    # CHECKOUT
    ##################################################

    - name: Checkout
      uses: actions/checkout@v4

    ##################################################
    # BASE PACKAGES
    ##################################################

    - name: Install base packages
      run: |
        sudo apt update
        sudo apt install -y curl wget tar net-tools

    ##################################################
    # NODE SETUP
    ##################################################

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Node dependencies
      run: |
        npm init -y
        npm install express cors body-parser socks-proxy-agent

    ##################################################
    # CREATE RELAY SERVER
    ##################################################

    - name: Create relay server
      run: |

        cat << 'EOF' > server.js
        const express = require("express")
        const cors = require("cors")
        const bodyParser = require("body-parser")
        const { SocksProxyAgent } = require("socks-proxy-agent")

        const app = express()

        const AUTH = process.env.TUNNEL_KEY || "change_me"

        const agent = new SocksProxyAgent(
          "socks5h://127.0.0.1:1080"
        )

        app.use(cors())
        app.use(bodyParser.json({limit:"20mb"}))

        app.get("/", (req,res)=>{
          res.send("🚀 GAS WARP Tunnel Alive")
        })

        app.post("/relay", async (req,res)=>{

          if(req.headers["x-auth"] !== AUTH){
            return res.status(403).json({
              error:"forbidden"
            })
          }

          try{

            const r = req.body

            const response = await fetch(r.url,{
              method: r.method || "GET",
              headers: r.headers || {},
              body: r.body,
              agent: agent
            })

            const buffer = Buffer.from(
              await response.arrayBuffer()
            )

            res.json({
              ok:true,
              status:response.status,
              headers:Object.fromEntries(
                response.headers.entries()
              ),
              body:buffer.toString("base64")
            })

          }catch(e){

            res.status(500).json({
              ok:false,
              error:e.toString()
            })

          }

        })

        const PORT = 3000

        app.listen(PORT,()=>{
          console.log("Tunnel relay running on port "+PORT)
        })
        EOF

    ##################################################
    # START NODE
    ##################################################

    - name: Start relay server
      env:
        TUNNEL_KEY: ${{ secrets.TUNNEL_KEY }}
      run: |
        nohup node server.js > server.log 2>&1 &
        sleep 5
        cat server.log

    ##################################################
    # INSTALL WGCF
    ##################################################

    - name: Install WGCF
      run: |
        wget -q https://github.com/ViRb3/wgcf/releases/latest/download/wgcf_2.2.30_linux_amd64 -O wgcf
        chmod +x wgcf
        sudo mv wgcf /usr/local/bin/

        yes | wgcf register
        wgcf generate

    ##################################################
    # INSTALL WIREPROXY
    ##################################################

    - name: Install WireProxy
      run: |
        wget -q https://github.com/pufferffish/wireproxy/releases/latest/download/wireproxy_linux_amd64.tar.gz
        tar -xzf wireproxy_linux_amd64.tar.gz
        chmod +x wireproxy
        sudo mv wireproxy /usr/local/bin/

    ##################################################
    # BUILD WARP CONFIG
    ##################################################

    - name: Build WireProxy config
      run: |

        PRIVATE=$(grep PrivateKey wgcf-profile.conf | awk '{print $3}')
        ADDRESS=$(grep Address wgcf-profile.conf | awk '{print $3}')
        DNS=$(grep DNS wgcf-profile.conf | awk '{print $3}')
        PUBLIC=$(grep PublicKey wgcf-profile.conf | awk '{print $3}')
        ENDPOINT=$(grep Endpoint wgcf-profile.conf | awk '{print $3}')

        cat > config.ini <<EOF
        [Interface]
        PrivateKey = $PRIVATE
        Address = $ADDRESS
        DNS = $DNS

        [Peer]
        PublicKey = $PUBLIC
        Endpoint = $ENDPOINT

        [Socks5]
        BindAddress = 127.0.0.1:1080
        EOF

    ##################################################
    # START WARP
    ##################################################

    - name: Start WARP SOCKS5
      run: |
        nohup wireproxy -c config.ini > warp.log 2>&1 &
        sleep 10

        echo "==== WARP SOCKS ===="
        netstat -tulpn | grep 1080 || true

    ##################################################
    # TEST WARP
    ##################################################

    - name: Test WARP
      run: |
        curl --socks5 127.0.0.1:1080 https://ipinfo.io

    ##################################################
    # INSTALL CLOUDFLARED
    ##################################################

    - name: Install Cloudflared
      run: |
        wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
        chmod +x cloudflared

    ##################################################
    # START TUNNEL
    ##################################################

    - name: Start Cloudflare Tunnel
      run: |
        nohup ./cloudflared tunnel \
          --url http://127.0.0.1:3000 \
          --no-autoupdate \
          > tunnel.log 2>&1 &

        sleep 15

        echo "================================="
        echo "✅ CLOUDFLARE TUNNEL URL"
        grep -o 'https://[-0-9a-z]*\.trycloudflare\.com' tunnel.log | head -n 1
        echo "================================="

        cat tunnel.log

    ##################################################
    # KEEP RUNNER ALIVE
    ##################################################

    - name: Keep runner alive
      run: |
        echo "🚀 Tunnel alive for 6 hours"

        for i in $(seq 1 360)
        do
          curl --socks5 127.0.0.1:1080 https://ipinfo.io/ip || true
          sleep 60
        done
