name: GAS Hybrid Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest

    steps:

########################################################
# NODE
########################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

########################################################
# CREATE BACKEND
########################################################

      - name: Create backend server
        run: |

          cat > server.js << 'EOF'

          const http = require("http")
          const net = require("net")
          const crypto = require("crypto")

          ////////////////////////////////////////////////////
          // STORES
          ////////////////////////////////////////////////////

          const rtSessions = new Map()
          const wsSessions = new Map()

          ////////////////////////////////////////////////////
          // UTIL
          ////////////////////////////////////////////////////

          function json(res,obj){

            if(res.writableEnded) return

            res.writeHead(200,{
              "Content-Type":"application/json",
              "Access-Control-Allow-Origin":"*",
              "Cache-Control":"no-store"
            })

            res.end(JSON.stringify(obj))
          }

          function sid(){
            return crypto.randomBytes(12).toString("hex")
          }

          ////////////////////////////////////////////////////
          // HOST FILTER
          ////////////////////////////////////////////////////

          function validHost(host){

            if(!host) return false

            const h = String(host).toLowerCase()

            if(
              h === "localhost" ||
              h.startsWith("127.") ||
              h.startsWith("10.") ||
              h.startsWith("192.168.") ||
              h.startsWith("172.")
            ){
              return false
            }

            return true
          }

          ////////////////////////////////////////////////////
          // SERVER
          ////////////////////////////////////////////////////

          const server = http.createServer((req,res)=>{

            if(req.method==="GET"){
              return json(res,{
                ok:true,
                service:"gas-hybrid-backend",
                time:Date.now()
              })
            }

            let body=""

            req.on("data",(d)=>{

              body += d

              if(body.length > 20 * 1024 * 1024){
                req.destroy()
              }

            })

            req.on("end",()=>{

              try{

                const j = JSON.parse(body||"{}")

                //////////////////////////////////////////////////
                // REALTIME OPEN
                //////////////////////////////////////////////////

                if(j.op==="rt_open"){

                  const id = sid()

                  rtSessions.set(id,{
                    q:[],
                    ts:Date.now()
                  })

                  return json(res,{
                    ok:true,
                    sid:id
                  })

                }

                //////////////////////////////////////////////////
                // RT PUSH
                //////////////////////////////////////////////////

                if(j.op==="rt_push"){

                  const s = rtSessions.get(j.sid)

                  if(!s){
                    return json(res,{ok:false})
                  }

                  s.q.push(j.d)
                  s.ts=Date.now()

                  return json(res,{ok:true})

                }

                //////////////////////////////////////////////////
                // RT PULL
                //////////////////////////////////////////////////

                if(j.op==="rt_pull"){

                  const s = rtSessions.get(j.sid)

                  if(!s){
                    return json(res,{ok:false})
                  }

                  const d = s.q.shift() || null

                  s.ts=Date.now()

                  return json(res,{
                    ok:true,
                    d
                  })

                }

                //////////////////////////////////////////////////
                // RT CLOSE
                //////////////////////////////////////////////////

                if(j.op==="rt_close"){

                  rtSessions.delete(j.sid)

                  return json(res,{ok:true})

                }

                //////////////////////////////////////////////////
                // WS OPEN
                //////////////////////////////////////////////////

                if(j.op==="ws_open"){

                  const socket = new net.Socket()

                  socket.connect(80,new URL(j.url).hostname)

                  const id = sid()

                  wsSessions.set(id,{
                    socket,
                    q:[],
                    ts:Date.now()
                  })

                  socket.on("data",(d)=>{

                    const s = wsSessions.get(id)

                    if(s){
                      s.q.push(
                        d.toString("base64")
                      )
                    }

                  })

                  socket.on("close",()=>{
                    wsSessions.delete(id)
                  })

                  return json(res,{
                    ok:true,
                    sid:id
                  })

                }

                //////////////////////////////////////////////////
                // WS PUSH
                //////////////////////////////////////////////////

                if(j.op==="ws_push"){

                  const s = wsSessions.get(j.sid)

                  if(!s){
                    return json(res,{ok:false})
                  }

                  s.socket.write(
                    Buffer.from(j.frame,"base64")
                  )

                  return json(res,{ok:true})

                }

                //////////////////////////////////////////////////
                // WS PULL
                //////////////////////////////////////////////////

                if(j.op==="ws_pull"){

                  const s = wsSessions.get(j.sid)

                  if(!s){
                    return json(res,{ok:false})
                  }

                  const frame = s.q.shift() || null

                  return json(res,{
                    ok:true,
                    frame
                  })

                }

                //////////////////////////////////////////////////
                // WS CLOSE
                //////////////////////////////////////////////////

                if(j.op==="ws_close"){

                  const s = wsSessions.get(j.sid)

                  if(s){
                    s.socket.destroy()
                  }

                  wsSessions.delete(j.sid)

                  return json(res,{ok:true})

                }

                //////////////////////////////////////////////////
                // TCP TUNNEL
                //////////////////////////////////////////////////

                if(j.op==="tunnel"){

                  if(!validHost(j.h)){
                    return json(res,{
                      ok:false,
                      error:"blocked_host"
                    })
                  }

                  const socket =
                    net.connect(
                      Number(j.p),
                      j.h
                    )

                  socket.setTimeout(20000)

                  const chunks=[]

                  socket.on("connect",()=>{

                    if(j.d){

                      socket.write(
                        Buffer.from(j.d,"base64")
                      )

                    }

                  })

                  socket.on("data",(d)=>{
                    chunks.push(d)
                  })

                  socket.on("end",()=>{

                    const buf =
                      Buffer.concat(chunks)

                    return json(res,{
                      ok:true,
                      d:buf.toString("base64")
                    })

                  })

                  socket.on("timeout",()=>{

                    socket.destroy()

                    return json(res,{
                      ok:false,
                      error:"timeout"
                    })

                  })

                  socket.on("error",(e)=>{

                    return json(res,{
                      ok:false,
                      error:String(e)
                    })

                  })

                  return
                }

                //////////////////////////////////////////////////
                // BATCH
                //////////////////////////////////////////////////

                if(j.op==="batch"){

                  const out=[]

                  for(const op of j.ops||[]){

                    out.push({
                      ok:false,
                      error:"not_implemented"
                    })

                  }

                  return json(res,{
                    ok:true,
                    results:out
                  })

                }

                return json(res,{
                  ok:false,
                  error:"unknown_op"
                })

              }catch(err){

                return json(res,{
                  ok:false,
                  error:String(err)
                })

              }

            })

          })

          ////////////////////////////////////////////////////
          // TIMEOUTS
          ////////////////////////////////////////////////////

          server.keepAliveTimeout = 65000
          server.headersTimeout = 70000

          ////////////////////////////////////////////////////
          // START
          ////////////////////////////////////////////////////

          server.listen(8080,"0.0.0.0",()=>{

            console.log("HYBRID BACKEND READY")

          })

          ////////////////////////////////////////////////////
          // SESSION GC
          ////////////////////////////////////////////////////

          setInterval(()=>{

            const now = Date.now()

            for(const [k,v] of rtSessions){

              if(now - v.ts > 600000){
                rtSessions.delete(k)
              }

            }

            for(const [k,v] of wsSessions){

              if(now - v.ts > 600000){
                v.socket.destroy()
                wsSessions.delete(k)
              }

            }

          },60000)

          EOF

########################################################
# START BACKEND
########################################################

      - name: Start backend
        run: |
          nohup node server.js > backend.log 2>&1 &

########################################################
# SSH CLIENT
########################################################

      - name: Install SSH
        run: |
          sudo apt update
          sudo apt install -y openssh-client

########################################################
# START TUNNEL
########################################################

      - name: Start localhost.run tunnel
        run: |

          nohup ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=no \
            -R 80:localhost:8080 \
            nokey@localhost.run \
            > tunnel.log 2>&1 &

          echo "waiting for tunnel..."

          for i in {1..60}; do

            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+' tunnel.log | head -n 1)

            if [ ! -z "$URL" ]; then

              echo ""
              echo "==============================="
              echo "PUBLIC URL:"
              echo "$URL"
              echo "==============================="
              echo ""

              echo "$URL" > public_url.txt
              break

            fi

            sleep 2

          done

          cat tunnel.log

########################################################
# KEEP RUNNER ALIVE
########################################################

      - name: Keep Runner Alive
        run: |

          while true; do
            echo "alive $(date)"
            sleep 60
          done
