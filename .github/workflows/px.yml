name: GAS Hybrid Tunnel

on:
  workflow_dispatch:

jobs:
  tunnel:
    runs-on: ubuntu-latest

    steps:

      ########################################################
      # NODE
      ########################################################

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      ########################################################
      # CREATE BACKEND
      ########################################################

      - name: Create backend server
        run: |

          cat > server.js << 'EOF'

          const http = require("http");
          const net = require("net");

          //////////////////////////////////////////////////////
          // SESSION STORE
          //////////////////////////////////////////////////////

          const sessions = new Map();

          //////////////////////////////////////////////////////
          // JSON RESPONSE
          //////////////////////////////////////////////////////

          function json(res,obj){

            if(res.writableEnded){
              return;
            }

            res.writeHead(200,{
              "Content-Type":"application/json",
              "Access-Control-Allow-Origin":"*",
              "Cache-Control":"no-store"
            });

            res.end(JSON.stringify(obj));
          }

          //////////////////////////////////////////////////////
          // VALIDATE HOST
          //////////////////////////////////////////////////////

          function validHost(host){

            if(!host){
              return false;
            }

            const h = String(host).toLowerCase();

            if(
              h === "localhost" ||
              h.startsWith("127.") ||
              h.startsWith("10.") ||
              h.startsWith("192.168.") ||
              h.startsWith("172.16.") ||
              h.startsWith("172.17.") ||
              h.startsWith("172.18.") ||
              h.startsWith("172.19.") ||
              h.startsWith("172.20.") ||
              h.startsWith("172.21.") ||
              h.startsWith("172.22.") ||
              h.startsWith("172.23.") ||
              h.startsWith("172.24.") ||
              h.startsWith("172.25.") ||
              h.startsWith("172.26.") ||
              h.startsWith("172.27.") ||
              h.startsWith("172.28.") ||
              h.startsWith("172.29.") ||
              h.startsWith("172.30.") ||
              h.startsWith("172.31.")
            ){
              return false;
            }

            return true;
          }

          //////////////////////////////////////////////////////
          // SERVER
          //////////////////////////////////////////////////////

          const server = http.createServer((req,res)=>{

            ////////////////////////////////////////////////////
            // HEALTHCHECK
            ////////////////////////////////////////////////////

            if(req.method==="GET"){

              return json(res,{
                ok:true,
                ping:"pong"
              });

            }

            ////////////////////////////////////////////////////
            // BODY
            ////////////////////////////////////////////////////

            let body="";

            req.on("data",(d)=>{

              body += d;

              if(body.length > 10 * 1024 * 1024){

                req.destroy();

              }

            });

            ////////////////////////////////////////////////////
            // END
            ////////////////////////////////////////////////////

            req.on("end",()=>{

              try{

                const j =
                  JSON.parse(body || "{}");

                //////////////////////////////////////////////////
                // RT OPEN
                //////////////////////////////////////////////////

                if(j.op==="rt_open"){

                  const sid =
                    Math.random()
                    .toString(36)
                    .slice(2);

                  sessions.set(sid,{
                    q:[],
                    ts:Date.now()
                  });

                  return json(res,{
                    ok:true,
                    sid
                  });

                }

                //////////////////////////////////////////////////
                // RT PUSH
                //////////////////////////////////////////////////

                if(j.op==="rt_push"){

                  const s =
                    sessions.get(j.sid);

                  if(!s){

                    return json(res,{
                      ok:false,
                      error:"bad_sid"
                    });

                  }

                  s.ts = Date.now();

                  s.q.push(j.d);

                  return json(res,{
                    ok:true
                  });

                }

                //////////////////////////////////////////////////
                // RT PULL
                //////////////////////////////////////////////////

                if(j.op==="rt_pull"){

                  const s =
                    sessions.get(j.sid);

                  if(!s){

                    return json(res,{
                      ok:false,
                      error:"bad_sid"
                    });

                  }

                  s.ts = Date.now();

                  const data =
                    s.q.shift();

                  return json(res,{
                    ok:true,
                    d:data || null
                  });

                }

                //////////////////////////////////////////////////
                // RT CLOSE
                //////////////////////////////////////////////////

                if(j.op==="rt_close"){

                  sessions.delete(j.sid);

                  return json(res,{
                    ok:true
                  });

                }

                //////////////////////////////////////////////////
                // REAL TCP TUNNEL
                //////////////////////////////////////////////////

                if(j.op==="tunnel"){

                  //////////////////////////////////////////////////
                  // VALIDATE
                  //////////////////////////////////////////////////

                  if(
                    !j.h ||
                    !j.p
                  ){

                    return json(res,{
                      ok:false,
                      error:"bad_target"
                    });

                  }

                  if(!validHost(j.h)){

                    return json(res,{
                      ok:false,
                      error:"blocked_host"
                    });

                  }

                  //////////////////////////////////////////////////
                  // SOCKET
                  //////////////////////////////////////////////////

                  const socket =
                    net.connect(
                      Number(j.p),
                      j.h
                    );

                  socket.setTimeout(15000);

                  const chunks = [];

                  //////////////////////////////////////////////////
                  // CONNECT
                  //////////////////////////////////////////////////

                  socket.on("connect",()=>{

                    try{

                      if(j.d){

                        socket.write(
                          Buffer.from(
                            j.d,
                            "base64"
                          )
                        );

                      }

                    }catch(e){

                      socket.destroy();

                      return json(res,{
                        ok:false,
                        error:String(e)
                      });

                    }

                  });

                  //////////////////////////////////////////////////
                  // DATA
                  //////////////////////////////////////////////////

                  socket.on("data",(d)=>{

                    chunks.push(d);

                  });

                  //////////////////////////////////////////////////
                  // END
                  //////////////////////////////////////////////////

                  socket.on("end",()=>{

                    const buf =
                      Buffer.concat(chunks);

                    return json(res,{
                      ok:true,
                      d:buf.toString("base64")
                    });

                  });

                  //////////////////////////////////////////////////
                  // TIMEOUT
                  //////////////////////////////////////////////////

                  socket.on("timeout",()=>{

                    socket.destroy();

                    return json(res,{
                      ok:false,
                      error:"timeout"
                    });

                  });

                  //////////////////////////////////////////////////
                  // ERROR
                  //////////////////////////////////////////////////

                  socket.on("error",(e)=>{

                    return json(res,{
                      ok:false,
                      error:String(e)
                    });

                  });

                  return;
                }

                //////////////////////////////////////////////////
                // UNKNOWN
                //////////////////////////////////////////////////

                return json(res,{
                  ok:false,
                  error:"unknown_op"
                });

              }catch(err){

                return json(res,{
                  ok:false,
                  error:String(err)
                });

              }

            });

          });

          //////////////////////////////////////////////////////
          // TIMEOUTS
          //////////////////////////////////////////////////////

          server.keepAliveTimeout = 65000;
          server.headersTimeout = 70000;

          //////////////////////////////////////////////////////
          // START
          //////////////////////////////////////////////////////

          server.listen(8080,"0.0.0.0",()=>{

            console.log("REAL TCP BACKEND READY");

          });

          //////////////////////////////////////////////////////
          // SESSION CLEANER
          //////////////////////////////////////////////////////

          setInterval(()=>{

            const now = Date.now();

            for(const [sid,s] of sessions){

              if(now - s.ts > 1000 * 60 * 10){

                sessions.delete(sid);

              }

            }

          },60000);

          EOF

      ########################################################
      # START BACKEND
      ########################################################

      - name: Start backend
        run: |
          nohup node server.js > backend.log 2>&1 &

      ########################################################
      # INSTALL SSH
      ########################################################

      - name: Install SSH
        run: |
          sudo apt update
          sudo apt install -y openssh-client

      ########################################################
      # START LOCALHOST.RUN
      ########################################################

      - name: Start localhost.run tunnel
        run: |

          nohup ssh \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=no \
            -o ExitOnForwardFailure=yes \
            -R 80:localhost:8080 \
            nokey@localhost.run \
            > tunnel.log 2>&1 &

          echo "waiting for tunnel..."

          for i in {1..60}; do

            URL=$(grep -Eo 'https://[a-zA-Z0-9.-]+' tunnel.log | head -n 1)

            if [ ! -z "$URL" ]; then

              echo ""
              echo "=================================="
              echo "PUBLIC URL:"
              echo "$URL"
              echo "=================================="
              echo ""

              echo "$URL" > public_url.txt

              break

            fi

            sleep 2

          done

          cat tunnel.log

      ########################################################
      # SHOW URL
      ########################################################

      - name: Show Public URL
        run: |
          cat public_url.txt || true

      ########################################################
      # KEEP ALIVE
      ########################################################

      - name: Keep Runner Alive
        run: |

          while true; do

            echo "alive $(date)"

            sleep 60

          done
